<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Exercise 1: DOM Hello World</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <!-- Your JavaScript will add content here -->

    <script>
      // EXERCISE: Build a "Hello World" using vanilla JavaScript DOM manipulation
      
      // STEP 1: Create a div element
      const div = document.createElement('div');

      // MDN Reference: https://developer.mozilla.org/en-US/docs/Web/API/Document/createElement
      // The createElement method takes a tag name as a string parameter

      // STEP 2: Set the text content
      // You can use either .textContent or .innerHTML property
      // Set it to "Hello World"
      div.textContent = 'Hello World';

      // STEP 3: Add a CSS class
      // Use the .className property to add "container" class
      div.className = 'container';

      // STEP 4: Add inline styles using the .style property
      // You'll need to set multiple style properties:
      // - color (try 'white')
      // - fontSize (try '48px')
      // - padding (try '40px')
      // - backgroundColor (try 'rgba(255, 255, 255, 0.1)')
      // - borderRadius (try '16px')
      // - textAlign (try 'center')
      // Note: CSS properties in JS use camelCase (background-color → backgroundColor)
      div.style.color = 'white';
      div.style.textAlign = 'center';
      div.style.fontSize = '52px';
      div.style.fontWeight = 'bold';
      div.style.backgroundColor = 'rgba(237, 218, 228, 0.8)';
      div.style.padding = '20px 40px';
      div.style.borderRadius = '12px';
      

      // STEP 5: Append to the DOM
      // Use document.body.appendChild() to add your element to the page
      document.body.appendChild(div);
      
      // BONUS CHALLENGE 1: Create a second element (like a paragraph) with your name
      // Follow the same steps as above but use 'p' tag instead of 'div'
      const paragraph = document.createElement('p');
      paragraph.textContent = 'My name is Vika';
      paragraph.style.color = 'white';
      paragraph.style.fontSize = '24px';
      paragraph.style.textAlign = 'center';
      paragraph.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
      paragraph.style.borderRadius = '12px';
      paragraph.style.padding = '16px 32px';
      
      document.body.appendChild(paragraph);

      // BONUS CHALLENGE 2: Add a button that changes the text when clicked
      // 1. Create a button element
      // 2. Set its text to "Click Me"
      // 3. Add an event listener: button.addEventListener('click', function() { ... })
      // 4. Inside the function, change the div's textContent to something new
      const button = document.createElement('button');
      button.textContent = 'Click Me';
      button.style.fontSize = '18px';
      button.style.color = 'white';
      button.style.backgroundColor = 'rgba(239, 107, 175, 0.8)';
      button.style.padding = '5px 10px';
      button.style.borderRadius = '8px';

      button.addEventListener('click', () => {
        alert('Halo guysssssss!');
        div.textContent = 'Hey yowww!!!';
      })

      document.body.appendChild(button);
    </script>
  </body>
</html>
